<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert e Prompt</title>
    <style>
        body{
            background-color: blue;
            /*cor do fundo */
            color: aliceblue;
            /*cor da fonte */
            text-align: center;
            /*alinha o testo ao centro */
        }
    </style>
</head>
<body>
    <script>

        let Ron = prompt("Digite seu nome");
        //declarei a variavel Ron . pedi pra digitar o seu nome na caixa de alerta 

        document.write(Ron);
        //escrever ne tela o nome salvo na variavel

    </script>
    
</body>
</html>
