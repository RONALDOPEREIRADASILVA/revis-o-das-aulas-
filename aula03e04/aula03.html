<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Condições Aula 03</title>
  </head>
  <body>
    <script>
      let numero = 10;
      //atribuir o numero 10 a variavel numero.
      let nome = "Ronaldo";
      //atribuir Ronaldo a variavel nome.

      if (nome == "Ronaldo") {
        console.log("verdade");
        //condição se nome for Ronaldo imprime verdadeiro
      } else {
        console.log("falso");
        //se não imprime falso
      }

      if(numero != 10){
        console.log("verdade")
        //condiçãose o numero for diferente de 10  verdadeiro
      }else {
        console.log("falso")
        //se não falso
      }

    </script>
  </body>
</html>
