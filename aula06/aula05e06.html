<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme</title>
</head>
<body>
    <script>
        let nome =prompt("Digite seu nome");
        //declara a variavel nome .e pede pra digitar na caixa o seu nome
        let res =confirm(nome + "deseja continuar?");
        //declara a variavel res e printa o nome salvo na variavel nome mas a frase deseja continuar
        alert(res);
        //resposta do alerta ,se for sim verdadeiro
        //se não falso

    </script>
    
</body>
</html>
