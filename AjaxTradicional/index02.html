<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requisições com fetch</title>
</head>
<body>
    <script>
        fetch('https://ubahthebuilder.tech/posts/1'),{
            method:'POST',
            body:JSON.stringify({
                title:'Ronaldo',
                body:'Meu conteudo',
                userId:10
            }),
            Headers:{
                'contant-type': 'application/jon; charset=UTF-8'
            }
        }
        .then(response=> response.json())
        .then(json=>console.log(json));

    </script>
</body>
</html>
